<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZRC Morning Intelligence · Zenith Rise Capital</title>
  <meta name="description" content="Daily geopolitical intelligence, capital markets signals and investment advisory briefing by Zenith Rise Capital" />
  <meta property="og:title" content="ZRC Morning Intelligence · Zenith Rise Capital" />
  <meta property="og:description" content="Markets · Geopolitics · Capital · Opportunities — Updated daily" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060D18;
      --panel: #0B1526;
      --panel-2: #0E1A2E;
      --gold: #C9A84C;
      --gold-soft: rgba(201,168,76,.14);
      --cream: #E8DCC8;
      --text: #A5B4C8;
      --muted: #5A6A80;
      --faint: #344156;
      --green: #34D399;
      --red: #F87171;
      --amber: #FBBF24;
      --line: rgba(201,168,76,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(201,168,76,.055), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: 'Source Serif 4', Georgia, serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    ::selection { background: rgba(201,168,76,.25); color: var(--cream); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,76,.22); border-radius: 3px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes headerReveal { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes loadDot { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
    @keyframes fabPulse {
      0%,100% { box-shadow: 0 4px 24px rgba(201,168,76,.35), 0 0 0 0 rgba(201,168,76,.4); }
      50% { box-shadow: 0 4px 24px rgba(201,168,76,.35), 0 0 0 8px rgba(201,168,76,0); }
    }

    .shell { max-width: 1080px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }

    /* HEADER */
    .header {
      border-bottom: 1px solid var(--line);
      padding: 28px 0 22px;
      animation: headerReveal .6s ease;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      animation: pulse 2s ease infinite; box-shadow: 0 0 8px rgba(52,211,153,.4);
      display: inline-block; vertical-align: middle;
    }

    .brand-tag {
      color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: 3px;
      font-family: 'JetBrains Mono', monospace; margin-left: 12px; vertical-align: middle;
    }

    .main-title {
      color: var(--cream);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 38px; line-height: 1; font-weight: 600; letter-spacing: -.6px;
      margin: 9px 0 7px;
    }

    .sub-title { color: var(--muted); font-size: 13px; letter-spacing: .15px; }

    .date-block { text-align: right; }
    .date-text {
      color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15px; font-weight: 500; margin-bottom: 2px;
    }
    .time-text, .generated-tag {
      font-family: 'JetBrains Mono', monospace;
    }
    .time-text { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
    .generated-tag { color: var(--faint); font-size: 9px; letter-spacing: .5px; margin-top: 5px; }

    .top-nav {
      display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1.2px;
    }
    .top-nav a { color: var(--muted); text-decoration: none; transition: color .2s; }
    .top-nav a:hover { color: var(--gold); }

    /* EXECUTIVE LAYER */
    .executive { padding-top: 24px; }

    .eyebrow {
      color: var(--gold); font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    }

    .section-title {
      color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px; font-weight: 600; margin-top: 5px;
    }

    .section-sub {
      color: var(--muted); font-size: 12px; margin-top: 3px;
    }

    .regime-grid {
      display: grid;
      grid-template-columns: 1.4fr repeat(4, 1fr);
      gap: 1px;
      margin-top: 16px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .regime-cell {
      background: linear-gradient(180deg, rgba(13,24,43,.98), rgba(8,16,30,.98));
      min-height: 88px; padding: 14px 15px;
    }

    .regime-cell.primary { background: linear-gradient(135deg, rgba(201,168,76,.12), rgba(11,21,38,.98)); }

    .metric-label {
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 8px; letter-spacing: 1.3px; text-transform: uppercase;
    }

    .metric-value {
      color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px; font-weight: 600; margin-top: 5px; line-height: 1.05;
    }

    .metric-sub {
      margin-top: 7px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: .4px;
    }

    .pulse-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 12px;
    }

    .pulse-card {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(15,25,45,.96), rgba(9,17,32,.98));
      border-radius: 7px; padding: 18px;
    }

    .pulse-num {
      color: var(--gold); font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: 1px;
    }

    .pulse-title {
      color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px; font-weight: 600; margin: 7px 0 6px;
    }

    .pulse-text { font-size: 12.5px; line-height: 1.55; color: var(--text); }

    /* SYNTHESIS */
    .global-briefing { padding-top: 12px; }
    .global-briefing-box {
      background: linear-gradient(135deg, rgba(201,168,76,.065), rgba(201,168,76,.018));
      border: 1px solid rgba(201,168,76,.14);
      border-radius: 8px; padding: 18px 22px;
    }
    .global-briefing-text {
      color: var(--cream); font-size: 15px; line-height: 1.62; font-style: italic;
    }
    .market-open {
      display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(201,168,76,.14);
    }
    .market-open-label {
      color: var(--gold); font-family: 'JetBrains Mono', monospace;
      font-size: 8px; font-weight: 700; letter-spacing: 1.2px; white-space: nowrap;
    }
    .market-open-text { color: var(--text); font-size: 13px; line-height: 1.55; flex: 1; min-width: 220px; }

    /* ANALYTIC GRIDS */
    .intel-section { padding-top: 26px; scroll-margin-top: 12px; }

    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin-bottom: 12px;
    }

    .mono-hint {
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: .7px;
    }

    .radar-grid {
      display: grid; grid-template-columns: 1.2fr .5fr .7fr .8fr;
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    }

    .radar-row { display: contents; }

    .radar-cell {
      min-height: 48px; display: flex; align-items: center;
      padding: 11px 14px; border-bottom: 1px solid rgba(201,168,76,.08);
      background: rgba(10,18,34,.76); font-size: 12px;
    }

    .radar-row:last-child .radar-cell { border-bottom: 0; }
    .radar-header .radar-cell {
      min-height: 34px; color: var(--muted); background: rgba(201,168,76,.04);
      font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 1px;
      text-transform: uppercase;
    }

    .theme-name { color: var(--cream); font-weight: 600; }
    .conviction { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .7px; }
    .radar-dir { font-size: 15px; line-height: 1; letter-spacing: 0; }
    .stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
    .dir-up { color: var(--green); }
    .dir-down { color: var(--red); }
    .dir-flat { color: var(--muted); }

    .house-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
    }

    .house-card {
      border: 1px solid var(--line); border-radius: 7px; background: rgba(10,18,34,.8);
      padding: 15px 16px;
    }

    .house-card-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .house-label { color: var(--cream); font-size: 13px; font-weight: 600; }
    .house-view {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px;
    }
    .house-change { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 8px; }
    /* A stance that moved is never rendered in the same grey as one that held. */
    .house-change.chg-up { color: #7FD8B0; }
    .house-change.chg-down { color: #F0A5A5; }

    .house-marker {
      font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700;
      letter-spacing: 1.1px; margin-top: 9px;
    }
    .mark-up { color: var(--green); }
    .mark-down { color: var(--red); }
    .mark-flat { color: var(--faint); }

    /* Stance colour follows the stance itself, not the signal field. */
    .view-pos { color: var(--green); }
    .view-mild { color: var(--gold); }
    .view-flat { color: var(--muted); }
    .view-warn { color: var(--amber); }
    .view-neg { color: var(--red); }

    .catalyst-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .catalyst {
      border-left: 2px solid rgba(201,168,76,.55); background: rgba(10,18,34,.7);
      padding: 13px 15px; border-radius: 0 6px 6px 0;
    }
    .catalyst-time {
      color: var(--gold); font-family: 'JetBrains Mono', monospace;
      font-size: 9px; letter-spacing: .8px;
    }
    .catalyst-title { color: var(--cream); font-size: 13px; margin-top: 5px; }
    .catalyst-impact {
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 8px; letter-spacing: 1px; margin-top: 7px;
    }

    /* DESKS */
    main { padding-top: 28px; padding-bottom: 72px; }
    .desks-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .mono-label {
      color: var(--muted); font-size: 11px;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;
    }

    .cat-btn {
      width: 100%; background: transparent;
      border: 1px solid rgba(201,168,76,.1); border-radius: 6px;
      padding: 15px 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: space-between;
      transition: all .3s ease; margin-bottom: 6px; text-align: left;
    }
    .cat-btn:hover { background: linear-gradient(90deg, rgba(201,168,76,.055), transparent); }
    .cat-btn.open { background: linear-gradient(90deg, rgba(201,168,76,.08), transparent); }
    .cat-btn-left { display: flex; align-items: center; gap: 13px; }
    .cat-icon { font-size: 20px; flex-shrink: 0; }
    .cat-label {
      color: var(--cream); font-size: 15px; font-weight: 600;
      font-family: 'Cormorant Garamond', Georgia, serif; letter-spacing: .3px;
    }
    .cat-desc { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .cat-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cat-count {
      color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cat-raw {
      color: var(--faint); font-size: 8px; letter-spacing: .5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cat-arrow { color: var(--muted); font-size: 16px; transition: transform .3s ease; }
    .cat-arrow.open { transform: rotate(180deg); }
    .cat-content { padding: 8px 0 12px; animation: fadeIn .3s ease; }

    /* NEWS CARDS */
    .news-card {
      background: linear-gradient(135deg, rgba(15,25,45,.95), rgba(10,18,35,.98));
      border: 1px solid rgba(201,168,76,.12);
      border-left: 3px solid rgba(201,168,76,.4);
      border-radius: 6px; padding: 17px 19px; cursor: pointer;
      transition: all .3s ease; margin-bottom: 8px;
    }
    .news-card:hover, .news-card.expanded {
      border-left-color: rgba(201,168,76,.85);
      background: linear-gradient(135deg, rgba(18,30,52,.98), rgba(12,22,42,1));
    }

    .news-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .news-headline {
      color: var(--cream); font-size: 15px; font-weight: 600; line-height: 1.4;
      font-family: 'Cormorant Garamond', Georgia, serif; flex: 1;
    }

    .signal-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.3px; padding: 3px 8px;
      border-radius: 3px; font-family: 'JetBrains Mono', monospace; white-space: nowrap;
    }
    .signal-bullish { background: #0D3B2E; color: var(--green); }
    .signal-bearish { background: #3B1A1A; color: var(--red); }
    .signal-neutral { background: #2A2A3A; color: var(--text); }
    .signal-watch { background: #3B2E0D; color: var(--amber); }

    .signal-strip {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px;
    }
    .micro-badge {
      border: 1px solid rgba(201,168,76,.11); border-radius: 3px;
      color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 8px; letter-spacing: .8px; padding: 3px 6px;
    }

    .news-detail { margin-top: 12px; animation: fadeIn .3s ease; }
    .detail-label {
      color: var(--gold); font-family: 'JetBrains Mono', monospace;
      font-size: 8px; font-weight: 700; letter-spacing: 1.2px; margin-bottom: 4px;
    }
    .news-summary { color: var(--text); font-size: 13px; line-height: 1.65; margin-bottom: 11px; }
    .news-relevance {
      background: rgba(201,168,76,.06); border-radius: 4px;
      padding: 10px 13px; margin-bottom: 9px; color: var(--cream); font-size: 12px; line-height: 1.5;
    }
    .news-source {
      color: var(--muted); font-size: 9px;
      font-family: 'JetBrains Mono', monospace; letter-spacing: .5px;
    }

    .takeaway-box {
      margin-top: 10px; background: linear-gradient(135deg, rgba(201,168,76,.08), rgba(201,168,76,.03));
      border: 1px solid rgba(201,168,76,.15); border-radius: 6px; padding: 14px 18px;
    }
    .takeaway-label {
      color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
      margin-bottom: 6px; font-family: 'JetBrains Mono', monospace;
    }
    .takeaway-text { color: var(--cream); font-size: 14px; line-height: 1.5; font-style: italic; }

    /* STATES */
    .loading-state { text-align: center; padding: 100px 20px; }
    .loading-dots span {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); margin: 0 4px;
    }
    .loading-dots span:nth-child(1) { animation: loadDot 1.4s infinite 0s; }
    .loading-dots span:nth-child(2) { animation: loadDot 1.4s infinite .2s; }
    .loading-dots span:nth-child(3) { animation: loadDot 1.4s infinite .4s; }

    .error-banner {
      background: rgba(248,113,113,.06); border: 1px solid rgba(248,113,113,.15);
      border-radius: 6px; padding: 18px 24px; text-align: center; margin-bottom: 20px;
    }
    .error-banner p { color: var(--red); font-size: 13px; margin-bottom: 4px; }
    .error-banner small { color: var(--muted); font-size: 10px; font-family: 'JetBrains Mono', monospace; }

    /* SUBSCRIBE */
    .fab-subscribe {
      position: fixed; bottom: 28px; right: 28px; z-index: 1000;
      background: linear-gradient(135deg, #C9A84C, #A8893A); color: var(--bg);
      border: none; border-radius: 50px; padding: 13px 20px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer;
      transition: all .3s ease; display: flex; align-items: center; gap: 8px;
      animation: fabPulse 3s ease infinite;
    }
    .fab-subscribe:hover { transform: translateY(-2px); }

    .subscribe-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(4,8,16,.86); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn .25s ease; padding: 20px;
    }
    .subscribe-modal {
      background: linear-gradient(135deg, #0C1628, #0A1220);
      border: 1px solid rgba(201,168,76,.2); border-radius: 12px;
      padding: 36px 32px; max-width: 440px; width: 100%;
      animation: fadeSlideIn .3s ease; position: relative;
    }
    .subscribe-close {
      position: absolute; top: 14px; right: 18px;
      background: none; border: none; color: var(--muted);
      font-size: 22px; cursor: pointer; padding: 4px;
    }
    .subscribe-close:hover { color: var(--cream); }
    .subscribe-modal h2 {
      color: var(--cream); font-size: 24px; font-weight: 600; margin-bottom: 6px;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .subscribe-modal p { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
    .subscribe-modal .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .subscribe-modal input {
      flex: 1; background: rgba(255,255,255,.04);
      border: 1px solid rgba(201,168,76,.15); border-radius: 6px;
      padding: 12px 14px; color: var(--cream); font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    .subscribe-modal input:focus { border-color: rgba(201,168,76,.5); }
    .subscribe-modal input::placeholder { color: var(--faint); }
    .subscribe-submit {
      width: 100%; background: linear-gradient(135deg, #C9A84C, #A8893A);
      color: var(--bg); border: none; border-radius: 6px; padding: 13px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; cursor: pointer;
    }
    .subscribe-submit:disabled { opacity: .5; cursor: not-allowed; }
    .subscribe-note, .subscribe-error {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
    }
    .subscribe-note { color: var(--faint); text-align: center; margin-top: 14px; letter-spacing: .5px; }
    .subscribe-error { color: var(--red); margin-bottom: 10px; }
    .subscribe-success { text-align: center; padding: 10px 0; }
    .subscribe-success .check { font-size: 40px; margin-bottom: 12px; display: block; }
    .subscribe-success h3 {
      color: var(--green); font-size: 18px; margin-bottom: 8px;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    footer {
      border-top: 1px solid rgba(201,168,76,.1);
      padding: 22px 32px 28px; text-align: center;
    }
    .footer-brand {
      color: var(--faint); font-size: 9px;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; margin-bottom: 5px;
    }
    .footer-legal { color: #2A3340; font-size: 9px; }

    @media (max-width: 820px) {
      .regime-grid { grid-template-columns: repeat(2,1fr); }
      .regime-cell.primary { grid-column: span 2; }
      .pulse-grid, .house-grid, .catalyst-grid { grid-template-columns: 1fr; }
      .radar-grid { grid-template-columns: 1fr .45fr .65fr; }
      .radar-cell:nth-child(4n) { display: none; }
    }

    @media (max-width: 640px) {
      .shell { padding-left: 16px; padding-right: 16px; }
      .header { padding-top: 20px; }
      .main-title { font-size: 31px; }
      .header-row { flex-direction: column; }
      .date-block { text-align: left; }
      .top-nav { gap: 12px; }
      .regime-grid { grid-template-columns: 1fr 1fr; }
      .regime-cell { min-height: 80px; }
      .pulse-card { padding: 15px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .cat-btn { padding: 13px 14px; }
      .news-card { padding: 14px 15px; }
      .cat-raw { display: none; }
      .radar-grid { grid-template-columns: 1fr .5fr; }
      .radar-cell:nth-child(3n), .radar-cell:nth-child(4n) { display: none; }
      .fab-subscribe { bottom: 18px; right: 14px; padding: 11px 15px; font-size: 9px; }
      .subscribe-modal { padding: 28px 22px; }
      .subscribe-modal .form-row { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Must stay in sync with the desk ids in generate-briefing.js (FEEDS).
    const CATEGORY_ORDER = [
      "macro", "geopolitics", "fdi", "critical-minerals", "real-estate",
      "ma-growth", "emerging-markets", "trade-policy", "food-agriculture"
    ];

    const SIGNAL_SCORE = { bullish: 2, watch: 0, neutral: 0, bearish: -2 };

    function normalizeSignal(signal) {
      return ["bullish","bearish","neutral","watch"].includes(signal) ? signal : "neutral";
    }

    function labelFromSignal(signal) {
      return ({ bullish: "POSITIVE", bearish: "NEGATIVE", neutral: "NEUTRAL", watch: "WATCH" })[normalizeSignal(signal)];
    }

    function directionFromSignal(signal) {
      if (signal === "bullish") return { symbol: "↑", cls: "dir-up" };
      if (signal === "bearish") return { symbol: "↓", cls: "dir-down" };
      return { symbol: "→", cls: "dir-flat" };
    }

    function flattenItems(briefing) {
      if (!briefing || !briefing.categories) return [];
      return CATEGORY_ORDER.flatMap(function(catId) {
        const cat = briefing.categories[catId];
        if (!cat || !cat.items) return [];
        return cat.items.map(function(item) {
          return Object.assign({ categoryId: catId, categoryLabel: cat.label }, item);
        });
      });
    }

    function derivePulse(briefing) {
      if (briefing.executivePulse && briefing.executivePulse.length) return briefing.executivePulse.slice(0,3);

      const all = flattenItems(briefing);
      const ranked = all.slice().sort(function(a,b) {
        const ap = typeof a.impact === "number" ? a.impact : Math.abs(SIGNAL_SCORE[normalizeSignal(a.signal)] || 0);
        const bp = typeof b.impact === "number" ? b.impact : Math.abs(SIGNAL_SCORE[normalizeSignal(b.signal)] || 0);
        return bp - ap;
      });

      // One entry per desk — three cards on the same desk is not a pulse.
      const seen = {};
      const out = [];
      ranked.forEach(function(item) {
        if (out.length >= 3) return;
        const title = item.categoryLabel || "Key signal";
        if (seen[title]) return;
        seen[title] = true;
        out.push({
          title: title,
          text: item.relevance || item.summary || item.headline,
          signal: normalizeSignal(item.signal)
        });
      });
      return out;
    }

    function deriveRegime(briefing) {
      if (briefing.marketRegime) return briefing.marketRegime;

      const all = flattenItems(briefing);
      const score = all.reduce(function(sum,item) {
        return sum + (SIGNAL_SCORE[normalizeSignal(item.signal)] || 0);
      }, 0);

      let tone = "BALANCED";
      if (score >= 4) tone = "CONSTRUCTIVE";
      if (score <= -4) tone = "CAUTIOUS";

      return {
        tone: tone,
        riskIndex: briefing.riskIndex ?? "—",
        europe: briefing.regionSignals?.europe || "NEUTRAL",
        spain: briefing.regionSignals?.spain || "NEUTRAL",
        privateMarkets: briefing.regionSignals?.privateMarkets || "SELECTIVE"
      };
    }

    function deriveRadar(briefing) {
      if (briefing.opportunityRadar && briefing.opportunityRadar.length) return briefing.opportunityRadar;

      const rows = CATEGORY_ORDER.map(function(catId) {
        const cat = briefing.categories?.[catId];
        if (!cat) return null;
        const items = cat.items || [];
        if (!items.length) return null;

        const score = items.reduce(function(sum,item) {
          return sum + (SIGNAL_SCORE[normalizeSignal(item.signal)] || 0);
        }, 0);

        const abs = items.reduce(function(sum,item) {
          return sum + Math.abs(SIGNAL_SCORE[normalizeSignal(item.signal)] || 0);
        }, 0);

        return {
          theme: cat.label,
          direction: score > 0 ? "up" : score < 0 ? "down" : "flat",
          conviction: abs >= 6 ? "HIGH" : abs >= 3 ? "MEDIUM" : "SELECTIVE",
          relevance: Math.min(5, Math.max(2, items.length))
        };
      }).filter(Boolean);

      return rows.slice(0,6);
    }

    const VIEW_TONE = {
      CONSTRUCTIVE: "view-pos",
      SELECTIVE: "view-mild",
      NEUTRAL: "view-flat",
      CAUTIOUS: "view-warn",
      DEFENSIVE: "view-neg"
    };

    // The verdict comes from the generator, which compares today's stance with
    // yesterday's. Briefings written before that field existed show no marker —
    // inferring one from the prose would repeat whatever the prose got wrong.
    function changeMarker(v) {
      const from = v.previousView ? " FROM " + String(v.previousView).toUpperCase() : "";
      if (v.direction === "upgraded") return { text: "▲ UPGRADED" + from, cls: "mark-up", textCls: "chg-up" };
      if (v.direction === "downgraded") return { text: "▼ DOWNGRADED" + from, cls: "mark-down", textCls: "chg-down" };
      if (v.direction === "unchanged") return { text: "UNCHANGED", cls: "mark-flat", textCls: "" };
      if (v.direction === "new") return { text: "INITIATED", cls: "mark-flat", textCls: "" };
      return null;
    }

    function SignalBadge({ signal }) {
      signal = normalizeSignal(signal);
      const cls = "signal-badge signal-" + signal;
      const labels = { bullish: "BULLISH", bearish: "BEARISH", neutral: "NEUTRAL", watch: "WATCH" };
      return <span className={cls}>{labels[signal]}</span>;
    }

    function ExecutiveLayer({ briefing }) {
      const regime = deriveRegime(briefing);
      const pulse = derivePulse(briefing);

      return (
        <section className="shell executive" id="pulse">
          <div className="eyebrow">60 SECOND READ</div>
          <h2 className="section-title">Executive Pulse</h2>
          <p className="section-sub">What matters before the working day begins.</p>

          <div className="regime-grid">
            <div className="regime-cell primary">
              <div className="metric-label">Market regime</div>
              <div className="metric-value">{regime.tone}</div>
              <div className="metric-sub">ZRC DAILY ASSESSMENT</div>
            </div>
            <div className="regime-cell">
              <div className="metric-label">Risk index</div>
              <div className="metric-value">{regime.riskIndex}</div>
              <div className="metric-sub">0 LOW · 100 HIGH</div>
            </div>
            <div className="regime-cell">
              <div className="metric-label">Europe</div>
              <div className="metric-value">{regime.europe}</div>
              <div className="metric-sub">HOUSE SIGNAL</div>
            </div>
            <div className="regime-cell">
              <div className="metric-label">Spain</div>
              <div className="metric-value">{regime.spain}</div>
              <div className="metric-sub">HOUSE SIGNAL</div>
            </div>
            <div className="regime-cell">
              <div className="metric-label">Private markets</div>
              <div className="metric-value">{regime.privateMarkets}</div>
              <div className="metric-sub">CAPITAL WINDOW</div>
            </div>
          </div>

          {pulse.length > 0 && (
            <div className="pulse-grid">
              {pulse.map(function(item,i) {
                return (
                  <div className="pulse-card" key={i}>
                    <div className="pulse-num">0{i+1} · {labelFromSignal(item.signal)}</div>
                    <div className="pulse-title">{item.title}</div>
                    <div className="pulse-text">{item.text}</div>
                  </div>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    function OpportunityRadar({ briefing }) {
      const rows = deriveRadar(briefing);
      if (!rows.length) return null;

      return (
        <section className="shell intel-section" id="radar">
          <div className="section-head">
            <div>
              <div className="eyebrow">CAPITAL ALLOCATION</div>
              <h2 className="section-title">ZRC Opportunity Radar</h2>
            </div>
            <div className="mono-hint">SIGNAL · CONVICTION · ZRC RELEVANCE</div>
          </div>

          <div className="radar-grid">
            <div className="radar-row radar-header">
              <div className="radar-cell">Theme</div>
              <div className="radar-cell">Signal</div>
              <div className="radar-cell">Conviction</div>
              <div className="radar-cell">Relevance</div>
            </div>

            {rows.map(function(row,i) {
              const d = row.direction === "up"
                ? { symbol:"↑", cls:"dir-up" }
                : row.direction === "down"
                ? { symbol:"↓", cls:"dir-down" }
                : { symbol:"→", cls:"dir-flat" };

              const relevance = Math.max(1, Math.min(5, Number(row.relevance || 3)));

              return (
                <div className="radar-row" key={i}>
                  <div className="radar-cell theme-name">{row.theme}</div>
                  <div className={"radar-cell conviction radar-dir " + d.cls}>{d.symbol}</div>
                  <div className="radar-cell conviction">{row.conviction || "SELECTIVE"}</div>
                  <div className="radar-cell stars">{"★".repeat(relevance)}{"☆".repeat(5-relevance)}</div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    function HouseView({ briefing }) {
      const views = briefing.houseView || [];
      if (!views.length) return null;

      return (
        <section className="shell intel-section" id="house-view">
          <div className="section-head">
            <div>
              <div className="eyebrow">PROPRIETARY VIEW</div>
              <h2 className="section-title">ZRC House View</h2>
            </div>
            <div className="mono-hint">CHANGE FROM PRIOR BRIEFING WHERE RELEVANT</div>
          </div>

          <div className="house-grid">
            {views.map(function(v,i) {
              const view = String(v.view || labelFromSignal(v.signal) || "").toUpperCase();
              const viewCls = VIEW_TONE[view] || "view-flat";
              const marker = changeMarker(v);

              return (
                <div className="house-card" key={i}>
                  <div className="house-card-top">
                    <div className="house-label">{v.label}</div>
                    <div className={"house-view " + viewCls}>{view}</div>
                  </div>
                  {v.change && (
                    <div className={"house-change " + (marker ? marker.textCls : "")}>{v.change}</div>
                  )}
                  {marker && (
                    <div className={"house-marker " + marker.cls}>{marker.text}</div>
                  )}
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    function CatalystCalendar({ briefing }) {
      const catalysts = briefing.catalysts || [];
      if (!catalysts.length) return null;

      return (
        <section className="shell intel-section" id="catalysts">
          <div className="section-head">
            <div>
              <div className="eyebrow">NEXT 72 HOURS</div>
              <h2 className="section-title">Catalyst Calendar</h2>
            </div>
            <div className="mono-hint">EVENTS WITH POTENTIAL MARKET SENSITIVITY</div>
          </div>

          <div className="catalyst-grid">
            {catalysts.slice(0,6).map(function(c,i) {
              return (
                <div className="catalyst" key={i}>
                  <div className="catalyst-time">{c.time || c.date || "TBC"}</div>
                  <div className="catalyst-title">{c.title}</div>
                  <div className="catalyst-impact">SENSITIVITY · {(c.impact || "MEDIUM").toUpperCase()}</div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    function NewsCard({ item, index }) {
      const [expanded, setExpanded] = useState(false);
      const impact = item.impact != null ? item.impact : null;
      const conviction = item.conviction || null;
      const horizon = item.horizon || null;

      return (
        <div
          className={"news-card" + (expanded ? " expanded" : "")}
          onClick={function() { setExpanded(!expanded); }}
          style={{ animation: "fadeSlideIn .4s ease " + (index * .06) + "s both" }}
        >
          <div className="news-card-header">
            <div className="news-headline">{item.headline}</div>
            <SignalBadge signal={item.signal} />
          </div>

          {(impact || conviction || horizon) && (
            <div className="signal-strip">
              {impact != null && <span className="micro-badge">IMPACT {impact}/5</span>}
              {conviction && <span className="micro-badge">CONVICTION {String(conviction).toUpperCase()}</span>}
              {horizon && <span className="micro-badge">HORIZON {String(horizon).toUpperCase()}</span>}
            </div>
          )}

          {expanded && (
            <div className="news-detail">
              {item.summary && (
                <>
                  <div className="detail-label">WHAT HAPPENED</div>
                  <p className="news-summary">{item.summary}</p>
                </>
              )}

              {item.relevance && (
                <>
                  <div className="detail-label">WHY IT MATTERS / ZRC VIEW</div>
                  <div className="news-relevance">{item.relevance}</div>
                </>
              )}

              {item.source && (
                <span className="news-source">SOURCE: {String(item.source).toUpperCase()}</span>
              )}
            </div>
          )}
        </div>
      );
    }

    function CategorySection({ catData }) {
      const [isOpen, setIsOpen] = useState(false);
      const items = catData.items || [];
      const hasData = items.length > 0;

      return (
        <div>
          <button className={"cat-btn" + (isOpen ? " open" : "")} onClick={function() { setIsOpen(!isOpen); }}>
            <div className="cat-btn-left">
              <span className="cat-icon">{catData.icon}</span>
              <div>
                <div className="cat-label">{catData.label}</div>
                <div className="cat-desc">{catData.description}</div>
              </div>
            </div>

            <div className="cat-right">
              {hasData && <span className="cat-count">{items.length} SIGNALS</span>}
              {catData.rawCount > 0 && <span className="cat-raw">FROM {catData.rawCount} SOURCES</span>}
              <span className={"cat-arrow" + (isOpen ? " open" : "")}>▾</span>
            </div>
          </button>

          {isOpen && (
            <div className="cat-content">
              {!hasData ? (
                <div style={{ textAlign:"center", padding:"20px", color:"#5A6A80", fontSize:"13px" }}>
                  No significant signals detected for this desk today.
                </div>
              ) : (
                <>
                  {items.map(function(item,i) {
                    return <NewsCard key={i} item={item} index={i} />;
                  })}

                  {catData.keyTakeaway && (
                    <div className="takeaway-box">
                      <div className="takeaway-label">KEY TAKEAWAY</div>
                      <div className="takeaway-text">{catData.keyTakeaway}</div>
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    function SubscribeButton() {
      const [showModal, setShowModal] = useState(false);
      const [email, setEmail] = useState("");
      const [firstName, setFirstName] = useState("");
      const [website, setWebsite] = useState("");
      const [token, setToken] = useState("");
      const [status, setStatus] = useState("idle");
      const [errorMsg, setErrorMsg] = useState("");
      const widgetRef = useRef(null);
      const widgetIdRef = useRef(null);

      useEffect(function() {
        if (!showModal || status === "success") return;

        let tries = 0;
        const iv = setInterval(function() {
          tries++;
          if (window.turnstile && widgetRef.current) {
            clearInterval(iv);

            if (widgetIdRef.current !== null) {
              try { window.turnstile.remove(widgetIdRef.current); } catch (e) {}
              widgetIdRef.current = null;
            }

            widgetIdRef.current = window.turnstile.render(widgetRef.current, {
              sitekey: "0x4AAAAAAC-gJp4BOq14SXQM",
              theme: "dark",
              callback: function(t) { setToken(t); },
              "error-callback": function() { setToken(""); },
              "expired-callback": function() { setToken(""); }
            });
          } else if (tries > 40) {
            clearInterval(iv);
          }
        }, 100);

        return function() {
          clearInterval(iv);
          if (widgetIdRef.current !== null && window.turnstile) {
            try { window.turnstile.remove(widgetIdRef.current); } catch (e) {}
            widgetIdRef.current = null;
          }
          setToken("");
        };
      }, [showModal, status]);

      function handleSubmit(e) {
        if (e) e.preventDefault();
        if (website) return;

        if (!email || !email.includes("@")) {
          setErrorMsg("Please enter a valid email.");
          setStatus("error");
          return;
        }

        if (!token) {
          setErrorMsg("Please complete the verification below.");
          setStatus("error");
          return;
        }

        setStatus("loading");
        setErrorMsg("");

        fetch("/.netlify/functions/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, firstName, token, website })
        })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              setStatus("success");
            } else {
              setErrorMsg(data.error || "Something went wrong.");
              setStatus("error");
              if (widgetIdRef.current !== null && window.turnstile) window.turnstile.reset(widgetIdRef.current);
              setToken("");
            }
          })
          .catch(function() {
            setErrorMsg("Connection failed. Please try again.");
            setStatus("error");
            if (widgetIdRef.current !== null && window.turnstile) window.turnstile.reset(widgetIdRef.current);
            setToken("");
          });
      }

      return (
        <>
          <button className="fab-subscribe" onClick={function() { setShowModal(true); setStatus("idle"); }}>
            <span style={{ fontSize:"15px" }}>📡</span>
            GET THE DAILY BRIEFING
          </button>

          {showModal && (
            <div className="subscribe-overlay" onClick={function(e) { if (e.target === e.currentTarget) setShowModal(false); }}>
              <div className="subscribe-modal">
                <button className="subscribe-close" onClick={function() { setShowModal(false); }}>×</button>

                {status === "success" ? (
                  <div className="subscribe-success">
                    <span className="check">✓</span>
                    <h3>Welcome to ZRC Intelligence</h3>
                    <p>Your first briefing arrives tomorrow morning.</p>
                  </div>
                ) : (
                  <>
                    <h2>Morning Intelligence</h2>
                    <p>Markets, geopolitics, capital and opportunities. Signal-classified intelligence from Zenith Rise Capital.</p>

                    {status === "error" && <div className="subscribe-error">{errorMsg}</div>}

                    <div className="form-row">
                      <input type="text" placeholder="First name (optional)" value={firstName} onChange={function(e) { setFirstName(e.target.value); }} />
                      <input type="email" placeholder="your@email.com" value={email} onChange={function(e) { setEmail(e.target.value); }} style={{ flex:2 }} />
                    </div>

                    <input
                      type="text" name="website" tabIndex="-1" autoComplete="off"
                      value={website} onChange={function(e) { setWebsite(e.target.value); }}
                      style={{ position:"absolute", left:"-9999px", opacity:0, pointerEvents:"none", height:0, width:0 }}
                      aria-hidden="true"
                    />

                    <div ref={widgetRef} style={{ margin:"4px 0 14px", minHeight:"65px" }}></div>

                    <button className="subscribe-submit" onClick={handleSubmit} disabled={status === "loading" || !token}>
                      {status === "loading" ? "SUBSCRIBING..." : "SUBSCRIBE — FREE"}
                    </button>

                    <div className="subscribe-note">No spam. Unsubscribe anytime. Protected by Cloudflare.</div>
                  </>
                )}
              </div>
            </div>
          )}
        </>
      );
    }

    function App() {
      const [briefing, setBriefing] = useState(null);
      const [loadError, setLoadError] = useState(false);

      useEffect(function() {
        fetch("data.json?v=" + Date.now())
          .then(function(r) {
            if (!r.ok) throw new Error("Not found");
            return r.json();
          })
          .then(function(data) { setBriefing(data); })
          .catch(function() { setLoadError(true); });
      }, []);

      const now = new Date();
      const timeStr = now.toLocaleTimeString("en-GB", {
        hour: "2-digit", minute: "2-digit", timeZoneName: "short"
      });

      if (!briefing && !loadError) {
        return (
          <div className="loading-state">
            <div className="loading-dots"><span></span><span></span><span></span></div>
            <p style={{ color:"#5A6A80", fontSize:"11px", fontFamily:"'JetBrains Mono', monospace", letterSpacing:"1px", marginTop:"16px" }}>
              LOADING ZRC INTELLIGENCE...
            </p>
          </div>
        );
      }

      const displayDate = briefing ? briefing.date : now.toLocaleDateString("en-GB", {
        weekday:"long", day:"numeric", month:"long", year:"numeric"
      });

      const generatedTime = briefing && briefing.generated
        ? new Date(briefing.generated).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" })
        : null;

      const totalItems = briefing?.categories
        ? Object.values(briefing.categories).reduce(function(sum,c) {
            return sum + (c.items ? c.items.length : 0);
          }, 0)
        : 0;

      return (
        <div>
          <header className="header">
            <div className="shell">
              <div className="header-row">
                <div>
                  <div>
                    <span className="live-dot"></span>
                    <span className="brand-tag">ZENITH RISE CAPITAL</span>
                  </div>
                  <h1 className="main-title">Morning Intelligence</h1>
                  <p className="sub-title">Markets · Geopolitics · Capital · Opportunities</p>
                </div>

                <div className="date-block">
                  <div className="date-text">{displayDate}</div>
                  <div className="time-text">{timeStr}</div>
                  {generatedTime && <div className="generated-tag">BRIEFING GENERATED {generatedTime} CET</div>}
                </div>
              </div>

              <nav className="top-nav">
                <a href="#pulse">EXECUTIVE PULSE</a>
                <a href="#radar">OPPORTUNITY RADAR</a>
                <a href="#house-view">HOUSE VIEW</a>
                <a href="#catalysts">CATALYSTS</a>
                <a href="#deep-dive">DEEP DIVE</a>
              </nav>
            </div>
          </header>

          {briefing && <ExecutiveLayer briefing={briefing} />}

          {briefing && (briefing.globalBriefing || briefing.marketOpen) && (
            <section className="shell global-briefing">
              <div className="global-briefing-box">
                <div className="eyebrow" style={{ marginBottom:"8px" }}>DAILY SYNTHESIS</div>
                {briefing.globalBriefing && (
                  <div className="global-briefing-text">{briefing.globalBriefing}</div>
                )}
                {briefing.marketOpen && (
                  <div className="market-open">
                    <span className="market-open-label">AT THE OPEN</span>
                    <span className="market-open-text">{briefing.marketOpen}</span>
                  </div>
                )}
              </div>
            </section>
          )}

          {briefing && <OpportunityRadar briefing={briefing} />}
          {briefing && <HouseView briefing={briefing} />}
          {briefing && <CatalystCalendar briefing={briefing} />}

          <main className="shell" id="deep-dive">
            {loadError && (
              <div className="error-banner">
                <p>Briefing data not yet available.</p>
                <small>The daily briefing is generated automatically. Run the GitHub Action manually if needed.</small>
              </div>
            )}

            {briefing && (
              <>
                <div className="section-head">
                  <div>
                    <div className="eyebrow">LEVEL 2 · DEEP DIVE</div>
                    <h2 className="section-title">Intelligence Desks</h2>
                  </div>
                  <div className="mono-hint">TAP DESK TO EXPAND · TAP SIGNAL FOR DETAIL</div>
                </div>

                <div className="desks-header">
                  <span className="mono-label">{CATEGORY_ORDER.length} DESKS · {totalItems} SIGNALS</span>
                </div>

                {CATEGORY_ORDER.map(function(catId) {
                  const catData = briefing.categories?.[catId];
                  if (!catData) return null;
                  return <CategorySection key={catId} catData={catData} />;
                })}
              </>
            )}
          </main>

          <footer>
            <div className="footer-brand">ZENITH RISE CAPITAL · INDEPENDENT INTELLIGENCE FOR CAPITAL ALLOCATION AND CORPORATE DECISIONS</div>
            <div className="footer-legal">Calesius Global S.L. · Madrid · For informational purposes only. Nothing herein constitutes investment advice or a recommendation to transact.</div>
          </footer>

          <SubscribeButton />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
