name: ZRC Daily Intelligence Briefing
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: zrc-daily-briefing-main
  cancel-in-progress: false
env:
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
  OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
  TZ: Europe/Madrid
jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Decide generation independently of delivery
        id: guard
        run: node scripts/pipeline.js guard
      - name: Generate sourced OpenAI briefing
        if: steps.guard.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node generate-briefing.js
          node scripts/pipeline.js validate
          cp data.json "$RUNNER_TEMP/generated-briefing.json"
      - name: Publish validated briefing
        if: steps.guard.outputs.generate == 'true'
        run: |
          git config user.name "ZRC Intelligence Bot"
          git config user.email "intelligence@zenithrisecapital.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if node scripts/pipeline.js validate >/dev/null 2>&1; then
              echo "A valid current edition is already published; using it for delivery."
              exit 0
            fi
            cp "$RUNNER_TEMP/generated-briefing.json" data.json
            node scripts/pipeline.js validate
            git add data.json
            git commit -m "Daily OpenAI briefing"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Deliver published edition or resume failed recipients
        id: delivery
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node send-digest.js
      - name: Persist private delivery receipts even after partial failure
        if: always() && steps.delivery.outcome != 'skipped'
        run: |
          if [ ! -f delivery-state.json ]; then exit 0; fi
          cp delivery-state.json "$RUNNER_TEMP/delivery-state.json"
          git config user.name "ZRC Intelligence Bot"
          git config user.email "intelligence@zenithrisecapital.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/pipeline.js merge-ledger delivery-state.json "$RUNNER_TEMP/delivery-state.json"
            git add delivery-state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record briefing delivery receipts"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-diagnostics-${{ github.run_id }}
          path: failure-reason.txt
          if-no-files-found: ignore
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js
