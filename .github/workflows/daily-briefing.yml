name: ZRC Daily Intelligence Briefing

# GitHub does not guarantee scheduled runs: they are delayed under load and can
# be dropped entirely, which is what happened on 27 August 2026 — no run fired
# at all and no email went out. Two mitigations:
#   · the primary slot avoids :00, the most contended minute of the hour
#   · a backup slot three hours later retries, and no-ops when the day's
#     briefing is already published (see the guard step below)
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zrc-daily-briefing-main
  cancel-in-progress: false
jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      # Makes the backup slot safe: if the primary run already published today's
      # briefing, everything below is skipped and no second email goes out. When
      # the primary was dropped or failed, data.json still carries an older date
      # and the backup proceeds as a retry.
      - name: Check whether today's briefing is already published
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PUBLISHED=$(node -e "try{const b=require('./data.json');process.stdout.write(String(b.generated||'').slice(0,10))}catch(e){process.stdout.write('')}")
          echo "Published: ${PUBLISHED:-none} · Today: $TODAY"
          if [ "$PUBLISHED" = "$TODAY" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Today's briefing is already published — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate daily briefing
        if: steps.guard.outputs.already != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-briefing.js
      - name: Send email digest
        if: steps.guard.outputs.already != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node send-digest.js
      # A failed run is only useful if someone hears about it. On 4-6 September
      # six runs failed correctly and silently, and three days of briefings were
      # lost before anyone looked. Never fails the job itself.
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node alert.js
      - name: Commit and push data.json
        if: steps.guard.outputs.already != 'true'
        continue-on-error: true
        run: |
          git config user.name "ZRC Intelligence Bot"
          git config user.email "intelligence@zenrisecapital.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATESTR=$(date -u +"%Y-%m-%d")
          git commit -m "📡 Daily briefing — $DATESTR"
          git pull --rebase origin main
          git push origin HEAD:main
